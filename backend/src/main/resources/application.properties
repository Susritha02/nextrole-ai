server.port=8080

# ===============================================
# Database Configuration (MySQL with Environment Variable Overrides)
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_recommendation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Dialect auto-detected dynamically by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload configuration (PDF/DOCX Resumes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security Secrets
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.jobrec=INFO
logging.level.org.springframework.security=WARN
